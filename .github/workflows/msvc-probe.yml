name: MSVC UWP probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: windows-latest
    env:
      CC: cl
      CXX: cl
    steps:
      - uses: actions/checkout@v7

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install meson
        run: pip install meson ninja

      - name: Configure
        run: meson setup build-msvc --buildtype release -Dopenssl=disabled -Dextra_shaders=disabled

      - name: Show log tail
        if: always()
        run: |
          if (Test-Path build-msvc/meson-logs/meson-log.txt) { Get-Content build-msvc/meson-logs/meson-log.txt -Tail 80 } else { Write-Host "no meson log" }
