name: Ruby UWP probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y bison ccache cmake diffutils git make ruby
          sudo apt install -y ninja-build python3-pip
          pip3 install meson
          sudo apt install -y gcc g++ mingw-w64

      - uses: actions/checkout@v7

      - name: Make UWP cross file
        run: |
          sed "s/'-D_WIN32_WINNT=0x0601'/'-D_WIN32_WINNT=0x0A00', '-DWINAPI_FAMILY=2'/g" windows/meson-gcc-x86_64.txt > "$RUNNER_TEMP/uwp.txt"
          cat "$RUNNER_TEMP/uwp.txt"

      - name: Configure
        run: meson setup --cross-file "$RUNNER_TEMP/uwp.txt" --buildtype release -Dopenssl=disabled -Dextra_shaders=disabled build

      - name: Build only Ruby and keep going after errors
        continue-on-error: true
        env:
          MAKEFLAGS: k
        run: ninja -C build -k 0 subprojects/ruby-3_1_3/ruby-3_1_3.stamp > ninja.log 2>&1

      - name: Summary
        if: always()
        run: |
          echo "=== 1. objects that failed to compile ==="
          grep -oE "\*\*\* \[[^]]*\]" ninja.log | sed -E 's/.*: //; s/\]//' | sort | uniq -c | sort -rn | head -40
          echo "=== 2. most common error messages ==="
          grep -oE "error: .*" ninja.log | sort | uniq -c | sort -rn | head -25 | cut -c1-150
          echo "=== 3. first raw errors ==="
          grep -n "error:" ninja.log | head -12 | cut -c1-190
          echo "=== 4. end of the log ==="
          tail -n 5 ninja.log | cut -c1-190
