name: Link info

on:
  workflow_dispatch:

jobs:
  info:
    runs-on: ubuntu-latest
    steps:
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y bison ccache cmake diffutils git make ruby
          sudo apt install -y ninja-build python3-pip
          pip3 install meson
          sudo apt install -y gcc g++ mingw-w64

      - uses: actions/checkout@v7

      - name: Sanity check of the matrix method
        run: |
          printf 'extern __declspec(dllimport) void __stdcall CharNextW(void);\n__declspec(dllexport) int probe_value(void)\n{\n    volatile void *p = (void *)&CharNextW;\n    return p ? 42 : 0;\n}\n' > t.c
          x86_64-w64-mingw32-gcc -shared -O0 -o t_user32.dll t.c -luser32
          x86_64-w64-mingw32-objdump -p t_user32.dll | grep "DLL Name"

      - name: Configure
        run: meson setup --prefix "$(pwd)/build/artifact" --cross-file windows/meson-gcc-x86_64.txt --buildtype release -Dstrip=true -Dopenssl=disabled build

      - name: Print link command
        run: |
          ninja -C build -t commands mkxp-z.x86_64.exe > commands.txt || ninja -C build -t targets all | grep -i "exe" | head
          echo "lines: $(wc -l < commands.txt)"
          echo "=== flags and libraries of the final link ==="
          tail -n 1 commands.txt | tr ' ' '\n' | grep -E '^(-l|-L|-W|-s$|-m|-f|-pthread|--)|\.a$' | head -120
