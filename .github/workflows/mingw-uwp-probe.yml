name: MinGW UWP probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y bison ccache cmake diffutils git make ruby
          sudo apt install -y ninja-build python3-pip
          pip3 install meson
          sudo apt install -y gcc g++ mingw-w64

      - uses: actions/checkout@v7

      - name: Make UWP cross file
        run: |
          sed "s/0x0601/0x0A00/g" windows/meson-gcc-x86_64.txt > "$RUNNER_TEMP/uwp.txt"

      - name: Configure
        run: meson setup --prefix "$GITHUB_WORKSPACE/build/artifact" --cross-file "$RUNNER_TEMP/uwp.txt" --buildtype release -Dstrip=true -Dopenssl=disabled -Dextra_shaders=disabled -Dc_winlibs=-lwindowsapp -Dcpp_winlibs=-lwindowsapp build

      - name: Build
        run: ninja -C build -v > ninja.log 2>&1

      - name: Install
        run: meson install -C build --no-rebuild --tags mkxp-z

      - name: Inspect imports
        if: always()
        run: |
          ls -la build/artifact
          for f in build/artifact/*.exe; do
            echo "== $f"
            x86_64-w64-mingw32-objdump -p "$f" | grep "DLL Name" | sort -u
          done

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mkxp-z-win10-probe
          path: build/artifact
