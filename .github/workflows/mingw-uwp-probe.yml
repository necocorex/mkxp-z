name: MinGW UWP probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y bison ccache cmake diffutils git make ruby
          sudo apt install -y ninja-build python3-pip
          pip3 install meson
          sudo apt install -y gcc g++ mingw-w64

      - uses: actions/checkout@v7

      - name: Make UWP cross file
        run: |
          sed "s/0x0601/0x0A00/g" windows/meson-gcc-x86_64.txt > "$RUNNER_TEMP/uwp.txt"

      - name: Configure
        run: meson setup --cross-file "$RUNNER_TEMP/uwp.txt" --buildtype release -Dopenssl=disabled -Dextra_shaders=disabled -Dc_winlibs=-lwindowsapp -Dcpp_winlibs=-lwindowsapp build

      - name: Build
        continue-on-error: true
        run: ninja -C build -k 0 -v > ninja.log 2>&1

      - name: Show summary
        if: always()
        run: |
          echo "=== failed targets ==="
          grep "^FAILED" ninja.log | cut -c1-150 | head -30 || true
          echo "=== link problems ==="
          grep -E "cannot find -l" ninja.log | head -10 || true
          echo "=== undefined references ==="
          grep -o "undefined reference to .*" ninja.log | sort | uniq -c | sort -rn | head -50 || true
          echo "=== other errors ==="
          grep -E "error:" ninja.log | cut -c1-200 | head -25 || true
