name: MinGW UWP probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y bison ccache cmake diffutils git make ruby
          sudo apt install -y ninja-build python3-pip
          pip3 install meson
          sudo apt install -y gcc g++ mingw-w64

      - uses: actions/checkout@v7

      - name: Make UWP cross file
        run: |
          sed "s/'-D_WIN32_WINNT=0x0601'/'-D_WIN32_WINNT=0x0A00', '-DWINAPI_FAMILY=2'/g" windows/meson-gcc-x86_64.txt > "$RUNNER_TEMP/uwp.txt"

      - name: Configure
        run: meson setup --cross-file "$RUNNER_TEMP/uwp.txt" --buildtype release -Dopenssl=disabled -Dextra_shaders=disabled build

      - name: Build
        continue-on-error: true
        run: ninja -C build -v > ninja.log 2>&1

      - name: Show errors
        if: always()
        run: |
          echo "=== first errors ==="
          grep -n -E "error:|Error [0-9]|configure: error|undefined reference|cannot find|No such file" ninja.log | head -40 || true
          echo "=== meson-logs ==="
          ls build/meson-logs
          for f in build/meson-logs/*ruby*; do echo "=== $f"; tail -n 60 "$f"; done || true
          echo "=== ruby config.log ==="
          tail -n 60 build/subprojects/ruby-3_1_3/build/config.log || true
